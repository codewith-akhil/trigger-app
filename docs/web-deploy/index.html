<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trigger App — Live Stream</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #0b141a 0%, #111b21 60%, #005c4b 130%);
    color: #fff; padding: 24px; text-align: center;
  }
  .card {
    background: #111b21; border: 1px solid #233138; border-radius: 20px;
    padding: 40px 28px; max-width: 420px; width: 100%;
  }
  .logo {
    width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 18px;
    background: linear-gradient(135deg, #008069, #25D366);
    display: flex; align-items: center; justify-content: center; font-size: 34px;
  }
  h1 { font-size: 22px; margin-bottom: 8px; }
  p  { color: #8696a0; font-size: 14px; line-height: 1.5; margin-bottom: 24px; }
  a.btn {
    display: block; background: #25D366; color: #08130d; font-weight: 700;
    text-decoration: none; padding: 14px; border-radius: 12px; font-size: 15px;
    margin-bottom: 12px;
  }
  a.btn.ghost { background: transparent; color: #53bdeb; border: 1px solid #2a3942; }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">📡</div>
    <h1>Trigger App Live Stream</h1>
    <p id="msg">You've opened a Trigger App stream link. Install or open the app to view the schedule and reserve your slot.</p>
    <a class="btn" id="openApp" href="/">Open in Trigger App</a>
  </main>
<script>
  // Same path the app captures via the App Links intent-filter.
  // The button re-fires the exact deep link (opens the app when installed;
  // stays on this page otherwise). Add a Play Store fallback when published.
  document.getElementById('openApp').href = location.pathname + location.search;
</script>
</body>
</html>
